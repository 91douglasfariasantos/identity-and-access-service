<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro</title>
    <!-- CDN de instalação BootStrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- CDN de instalação de icons BootStrap-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />

<body>
  <div class="d-flex justify-content-center align-items-center min-vh-100 bg-light">
    <div class="card shadow border-0 p-5 mx-auto w-100 rounded-4" style="max-width: 420px;">
      <div class="text-center mb-4">
        <div
          class="bg-primary bg-opacity-10 d-inline-flex align-items-center justify-content-center rounded-3 p-3 mb-3">
          <i class="bi bi-person-plus fs-3 text-primary"></i>
        </div>
        <h2 class="fw-bold mb-1">
          Registro
        </h2>
        <p class="text-muted small">
          Crie sua conta para começar
        </p>
      </div>
      <form>
        <!-- NOME -->
        <div class="mb-3">
          <label for="name" class="form-label">Nome</label>
          <div class="position-relative">
            <i class="bi bi-person position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
            <input type="text" class="form-control ps-5" id="name" placeholder="Nome completo...">
            <div id="nameFeedbackInvalid" class="invalid-feedback" style="display: none !important;">
            Por favor, insira seu nome completo.
            </div>
            <div id="nameFeedbackValid" class="valid-feedback" style="display: none !important;">
            Nome válido!
            </div>
          </div>
        </div>

        <!-- EMAIL -->
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <div class="position-relative">
            <i class="bi bi-envelope position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
            <input type="email" class="form-control ps-5" id="email" aria-describedby="emailHelp"
              placeholder="Insira um email válido...">
          </div>
          <div id="emailHelp" class="form-text">
            Nunca compartilharemos seu e-mail com ninguém.
          </div>
        </div>

        <!-- SENHA -->
        <div class="mb-3">
          <label for="password" class="form-label">Senha</label>
          <div class="position-relative">
            <i class="bi bi-lock position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
            <input type="password" class="form-control ps-5 pe-5" id="password"
              placeholder="Crie uma senha...">
            <i class="bi bi-eye position-absolute top-50 end-0 translate-middle-y me-3 text-muted cursor-pointer" 
              id="togglePassword" style="cursor: pointer;"></i>
          </div>
        </div>

        <!-- CPF -->
        <div class="mb-3">
          <label for="cpf-user" class="form-label">CPF</label>
          <div class="position-relative">
            <i class="bi bi-credit-card position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
            <input type="password" class="form-control ps-5 pe-5" id="cpf-user"
              placeholder="Digite seu CPF...">
            <i class="bi bi-eye position-absolute top-50 end-0 translate-middle-y me-3 text-muted" 
              id="toggleCpf" style="cursor: pointer;"></i>
          </div>
        </div>

        <button type="button" class="btn btn-primary w-100" id="btnCadastrar">
          Cadastrar
        </button>
        <p class="text-center text-muted small mt-3 mb-0">
               Já tem uma conta? 
        <a href="login.html" class="text-decoration-none">
        Entrar 
        </a>
        </p>
      </form>
    </div>
  </div>

  <script src="./js/register.js"></script>


</body>
</html>
