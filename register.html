<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro</title>
    <!-- CDN de instalação BootStrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- CDN de instalação de icons BootStrap-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />


<body>

  <div class="d-flex justify-content-center align-items-center min-vh-100 bg-light">

    <div class="card shadow border-0 p-5 mx-auto w-100 rounded-4" style="max-width: 420px;">

      <div class="text-center mb-4">
        <div
          class="bg-primary bg-opacity-10 d-inline-flex align-items-center justify-content-center rounded-3 p-3 mb-3">
          <i class="bi bi-person-plus fs-3 text-primary"></i>
        </div>
        <h2 class="fw-bold mb-1">
          Registro
        </h2>
        <p class="text-muted small">
          Crie sua conta para começar
        </p>
      </div>

      <form>
        <div class="mb-3">
          <label for="email" class="form-label">Nome</label>
          <input type="text" class="form-control" id="name" placeholder="Nome completo...">
        </div>

        <div class="mb-3">
          <label for="exampleInputEmail1" class="form-label">
            Email
          </label>
          <input type="email" class="form-control" id="email" aria-describedby="emailHelp"
            placeholder="Insira um email válido...">

          <div id="emailHelp" class="form-text">
            Nunca compartilharemos seu e-mail com ninguém.
          </div>

        </div>

        <div class="mb-3">
          <label for="senha" class="form-label">Senha</label>
          <input type="password" class="form-control" id="password"
          placeholder="Crie uma senha..." >
        </div>

        <div class="mb-3">
          <label for="cpf" class="form-label">CPF</label>
          <input type="text" class="form-control" id="cpf-user"
          placeholder="Digite seu CPF...">
        </div>

        <button type="submit" class="btn btn-primary w-100">Enviar</button>

        <p class="text-center text-muted small mt-3 mb-0">
               Já tem uma conta? <a href="login.html" class="text-decoration-none">
                   Entrar </a>
            </p>
      </form>
    </div>

</body>
</html>
