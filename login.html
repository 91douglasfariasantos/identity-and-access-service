<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- CDN de instalação BootStrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- CDN de instalação de icons BootStrap-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
    
</head>
<body>

    <div class="d-flex justify-content-center align-items-center min-vh-100 bg-light">

        <div class="card shadow border-0 p-5 mx-auto w-100 rounded-4" style="max-width: 420px;">

            <div class="text-center mb-4">
                <div class="bg-primary bg-opacity-10 d-inline-flex align-items-center justify-content-center rounded-3 p-3 mb-3">
                <i class="bi bi-shield-lock fs-3 text-primary"></i>
                </div>
                <h2 class="fw-bold mb-1">
                    Bem-vindo
                </h2>
                <p class="text-muted small">
                Entre com suas credenciais para continuar
                </p>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">
                    E-mail
                </label>
                <input type="email" id="email" class="form-control" placeholder="seu@email.com" />
            </div>

            <div class="mb-4">
                <label for="senha" class="form-label">
                    Senha
                </label>
                <input type="password" id="senha" class="form-control" placeholder="••••••••" />
            </div>

            <button class="btn btn-primary w-100">
                Entrar
            </button>

            <p class="text-center text-muted small mt-3 mb-0">
                Não tem conta? <a href="register.html" class="text-decoration-none">
                Criar conta </a>
            </p>

        </div>
    </div>

</body>
</html>
