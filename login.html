<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
</head>

<body>

    <div class="d-flex justify-content-center align-items-center min-vh-100 bg-light">

        <div class="card shadow border-0 p-5 mx-auto w-100 rounded-4" style="max-width: 420px;">

            <!-- Cabeçalho -->
            <div class="text-center mb-4">
                <div class="bg-primary bg-opacity-10 d-inline-flex align-items-center justify-content-center rounded-3 p-3 mb-3">
                   <i class="bi bi-shield-lock fs-3 text-primary"></i>
                </div>
                <h2 class="fw-bold mb-1">
                Bem-vindo
                </h2>
                <p class="text-muted small">
                 Entre com suas credenciais para continuar
                </p>
            </div>

            <!-- Campo e-mail -->
            <div class="mb-3">
                <label for="email" class="form-label">
                    E-mail
                </label>
                <div class="position-relative">
                    <i class="bi bi-envelope position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
                    <input type="email" id="email" class="form-control ps-5" placeholder="seu@email.com" required />
                </div>
                <div id="emailFeedbackInvalid" class="invalid-feedback" style="display: none !important;">
                    Por favor, insira um e-mail válido.
                </div>
                <div id="emailFeedbackValid" class="valid-feedback" style="display: none !important;">
                    E-mail válido!
                </div>
            </div>

            <!-- Campo senha -->
            <div class="mb-4">
                <label for="senha" class="form-label">
                    Senha
                </label>

                <div class="password-container position-relative">

                    <i class="bi bi-lock position-absolute top-50 start-0 translate-middle-y ms-3 text-muted">
                    </i>

                    <input type="password" id="senha" class="form-control ps-5 pe-5" placeholder="••••••••" required
                        minlength="8" style="background-image: none;" />

                    <i class="bi bi-eye-fill position-absolute top-50 end-0 translate-middle-y me-3 text-muted"
                        id="toggleSenha" style="cursor: pointer;">
                    </i>
                </div>

                <div id="senhaFeedbackInvalid" class="invalid-feedback" style="display: none !important;">
                    A senha deve ter no mínimo 8 caracteres.
                </div>

                <div id="senhaFeedbackValid" class="valid-feedback" style="display: none !important;">
                    Senha válida!
                </div>

            </div>

            <!-- Botão -->
            <button class="btn btn-primary w-100" id="btnEntrar">Entrar</button>

            <!-- Rodapé -->
            <p class="text-center text-muted small mt-3 mb-0">
                Não tem conta? 
            <a href="register.html" class="text-decoration-none">
                Criar conta
            </a>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmLZDjNHZlW7kVwAykKBRn0aI5kI" crossorigin="anonymous"></script>

    <script src="./js/login.js"></script>

</body>
</html>
